name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # The main ruleset requires this check by name. The repository is public, so
  # GitHub's hosted runners are free; never attach the owner's runners here.
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: shell scripts parse
        run: for f in scripts/*.sh; do bash -n "$f"; done
      - name: the page scripts build and pass their tests
        # fixtures/buggy fails on purpose, so only scripts/ is vetted and tested.
        run: |
          if ls scripts/*.go >/dev/null 2>&1; then
            go vet ./scripts/ && go test -count=1 ./scripts/
          else
            echo "no Go scripts yet"
          fi
